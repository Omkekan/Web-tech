<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task9</title>
    <style>
        .clock {
            font-size: 50px;
            font-weight: 700;
            border: 5px solid black;
            width: 200px;
            padding: 10px;
            background-color: lightsalmon;
            border-radius: 30px;
        } 
        #d1{
                margin: auto;
        }
    </style>
</head>

<body>
    <div id="d1" class="clock"></div>
    <script>
        function myclock() {
            let dObj = new Date();
            document.getElementById("d1").innerHTML = dObj.toLocaleTimeString();
        }
        //myclock();
        setInterval(myclock, 1000);

    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Replace and Replace All</title>

    <link rel="stylesheet" href="./task11.css">
</head>

<body>

    <div class="container">

        <h2>Task11</h2>

        <div class="main-box">

            <!-- Text Area -->
            <textarea id="message"></textarea>

            <div class="inputs">

                <!-- Old Text -->
                <div class="input-group">
                    <label>Old Text</label>
                    <input type="text" id="oldText">
                </div>

                <!-- New Text -->
                <div class="input-group">
                    <label>New Text</label>
                    <input type="text" id="newText">
                </div>

            </div>

            <div class="buttons">

                <button onclick="replaceText()">
                    Replace
                </button>

                <button onclick="replaceAllText()">
                    Replace All
                </button>

            </div>

        </div>

    </div>

    <script src="./task11.js"></script>

</body>
</html>

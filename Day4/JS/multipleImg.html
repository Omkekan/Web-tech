<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Image</title>
    <style>
        div {
            border: 5px solid brown;
            width: 300px;
            text-align: center;
            /* justify-content: center; */
            padding: 7px;
            margin: auto;
        }
    </style>
</head>

<body>
    <div>
        <img id="d1" src="../Assets/pasta.jpeg" alt="pasta" height="300px" width="300px">
        <h2 id="n1">Pasta</h2>
        <button type="button" onclick="changeImage('../Assets/cahin.jpeg','Chain')">chain</button>
        <button type="button" onclick="changeImage('../Assets/doll.jpeg','Doll')">doll</button>
        <button type="button" onclick="changeImage('../Assets/key.jpeg','Key')">Key</button>
    </div>
    <script>
        function  changeImage(imgpath,imgName){
           document.getElementById("d1").src=imgpath;
           document.getElementById("n1").innerHTML=imgName;
        }
    </script>
</body>

</html>

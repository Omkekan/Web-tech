       <form method="get">
     <label for="txt1">Enter your fullname:</label><br>
     <input type="text" name="fname" id="txt1" placeholder="enter your fullname" minlength="2" maxlength="20" pattern="^[a-zA-Z ]{2,20}$" required=""> <br>
    <label for="txt2">Enter your password:</label><br>
     <input type="password" name="pass" id="txt2" placeholder="enter your password" pattern="^(?=.*[0-9])(?=.*[!@#$%^&amp;*])[a-zA-Z0-9!@#$%^&amp;*]{6,16}$" required=""> <br>
    <label for="">Enter your Email:</label><br>
    <input type="email" name="uemail" required=""> <br>

    <label for="">Enter your contact:</label><br>
    <input type="tel" name="ucontact" pattern="^[0-9]{10,11}$" required=""> <br>

    <label for="">Enter your Age:</label><br>
    <input type="number" name="uage" min="18" max="60" required=""> <br>

     <label for="">Select Your DOB:</label><br>
    <input type="date" name="udob" required=""> <br>
     
    <label for="">Select your gender:</label>

    <input type="radio" name="gender" value="female" required="">Female
    <input type="radio" name="gender" value="transgender" required="">Transgender
    <br>
<label for="">Select Your Qualification</label><br>

 <label for="">Enter your feedback</label><br>

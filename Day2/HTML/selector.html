<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selectors</title>
    <style>
        /* 1.element name css */
        h2{
            color: saddlebrown;
            text-align: center;
        }
        /* 2.Group selector */
        strong,b,u{
            font-size: 50px;
            color: violet;
        }
        /* 3.by id */
        #d5{
            color: blue;
            background-color: yellow;
            text-align: center;
            font-size: 20px;
        }
        /* 4.by class name */
        .cls1{
            font-size: 30px;
            color: aqua;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-align: right;
        }
        /* 5.universla */
        *{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h2>Ajinkya</h2>
    <strong>Future</strong><b> Is blank </b>
    <u>but is brighter</u>
    <div class="cls1">Div-1</div>
    <div class="cls1">Div-2</div>
    <div class="cls1">Div-3</div>
    <div class="cls1">Div-4</div>
    <div id="d5" >Div-5</div>
    <div>Div-6</div>
</body>
</html>

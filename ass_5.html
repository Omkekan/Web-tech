<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        .form-row{
            display: flex;
            gap: 25%;
        }
         .form-group {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="container mt-2">
     <header class="p-3 text-bg-dark"> 
        <div class="container"> 
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"> 
                <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none"> 
                    <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap">
                        <use xlink:href="#bootstrap">
                        </use>
                    </svg> 
                </a> 
                        <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                            <li><a href="#" class="nav-link px-2 text-secondary">Home</a></li>
                            <li><a href="#" class="nav-link px-2 text-white">Features</a></li>
                            <li><a href="#" class="nav-link px-2 text-white">Pricing</a></li> 
                            <li><a href="#" class="nav-link px-2 text-white">FAQs</a></li> 
                            <li><a href="#" class="nav-link px-2 text-white">About</a></li> 
                        </ul> 
                        <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search"> 
                            <input type="search" class="form-control form-control-dark text-bg-dark" placeholder="Search..." aria-label="Search"> 
                        </form> 
                    <div class="text-end"> 
                        <button type="button" class="btn btn-outline-light me-2">Login</button> 
                        <button type="button" class="btn btn-warning">Sign-up</button> 
                    </div> 
            </div> 
        </div> 
    </header>

        <form>
            <div class="form-row">

                <div class="form-group">
                <label for="" class="form-label">Email: </label>
                <input type="email" name="uemail" class="form-control" required>
                </div>

                <div class="form-group">
                <label for="" class="form-label">Password: </label>
                <input type="password" name="upassword" class="form-control" required>
                </div>

            </div>

            <div class="form-group">
                <label for="" class="form-label">Address1: </label>
                <input type="text"  name="uaddress" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="" class="form-label">Address2: </label>
                <input type="text" name="Address2" class="form-control" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                <label class="form-label">City: </label>
                <input type="text" name="ucity" class="form-control" required>
                </div>

                <div class="form-group">
                <label class="form-label">State: </label>
                <select name="ustate" id="" class="form-control">
                    <option value="">Choose</option>
                    <option value="MH">MAHARASHTRA</option>
                    <option value="PUN">PUNJAB</option>
                    <option value="HAR">HARYANA</option>
                    <option value="TN">TAMIL NADU</option>
                </select>
                </div>

                <div class="form-group">
                <label class="form-label">Zip: </label>
                <input type="number" name="uzip" class="form-control" required pattern="^[0-9]{6}$">
                </div>

            </div>
            
            <div class="form-group2">
                <input type="checkbox" >
                <label for="" class="form-label">Check Me Out</label>
            </div>

            <div class="form-group2">
                <button type="submit" class="btn btn-primary">Sign In</button>
            </div>


        </form>

    </div>
    
</body>
</html>

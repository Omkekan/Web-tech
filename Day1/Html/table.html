<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="10" width="50%">
        <thead>
            <tr>
                <th>Sr.no</th> <th>Name</th> <th>Addrress</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td> <td>Ajinkya</td><td>Ahilyanagar</td>
            </tr>
            <tr>
                <td>102</td> <td>Paji</td><td>Punjab</td>
            </tr>
            <tr>
                <td>103</td> <td>Babua</td><td>Bihar</td>
            </tr>
        </tbody>
    </table>
    <h2>Rowspan Table</h2>
    <table border="10" width="50%">
        <tr align="center">
            <td>A</td><td rowspan="2">B</td><td>C</td>
        </tr>
         <tr align="center">
            <td>D</td><td>E</td>
        </tr>
         <tr align="center">
            <td>F</td><td>G</td><td>H</td>
        </tr>
        <tr align="center">
            <td colspan="2" height="5">I</td><td>J</td>
        </tr>
    </table>
    <h2>Table with rowspan and colspan</h2>
    <table border="10" width="25%">
        <tr>
            <td colspan="2" rowspan="2">A</td><td>B</td>
        </tr>
        <tr>
            <td>C</td>
        </tr>
        <tr>
            <td>D</td><td>E</td><td>F</td>
        </tr>
        
    </table>
   
</body>
</html>

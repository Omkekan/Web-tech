<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Document</title>
    <style>
        .myimg{
            border: 2px solid purple;
            height:200px; 
            width:200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="myimg rounded" src="./Assets/goldchest.jpeg" alt="goldchest">
        <img class="myimg rounded-circle" src="./Assets/key.jpeg" alt="goldchest">
        <img class="myimg img-thumbnail" src="./Assets/iphone 18pro.jpeg" alt="goldchest">
        <hr>
        <!-- Color classes -->
        <h2 class="text-primary bg-danger">Hello Chaining of classes</h2>
        <h2 class="text-secondary bg-primary">Hello Chaining of classes</h2>
        <h2 class="text-info bg-secondary">Hello Chaining of classes</h2>
        <h2 class="text-danger bg-success">Hello Chaining of classes</h2>
        <h2 class="text-warning bg-danger">Hello Chaining of classes</h2>
        <h2 class="text-success bg-warning">Hello Chaining of classes</h2>
        <h2 class="text-white bg-dark">Hello Chaining of classes</h2>
        <h2 class="text-muted bg-white">Hello Chaining of classes</h2>
        <h2 class="text-dark bg-warning">Hello Chaining of classes</h2>
        <hr>
        <!-- button classes -->
         <button class="">aman</button>
         <button class="btn">aman</button>
         <button class="btn btn-primary">aman</button>
         <button class="btn btn-success">aman</button><br>
         <button class="btn btn-outline-success">aman</button>
         <button class="btn btn-outline-primary">aman</button>
         <button class="btn btn-outline-dark">aman</button>
         <button class="btn btn-outline-white">aman</button>
         <!-- <button class="btn btn-outline-">aman</button> -->
         <button class="btn btn-outline-warning">aman</button>
         <button class="btn btn-outline-dark">aman</button>
         <button class="btn btn-outline-danger">aman</button><br>
         <br><br>
            <button class="btn btn-lg btn-primary">aman</button>
            <button class="btn btn-primary">aman</button>
            <button class="btn btn-sm btn-primary">aman</button>
<br><br>
        <!-- button with fullwidth -->
        <div class="d-grid">
            <button class="btn btn-primary" type="button">aman</button>
        </div>
<br><br>
        <!-- Spinner border -->
        
        <span class="spinner-border"></span>
        <span class="spinner-border spinner-border-sm"></span>
        <span class="spinner-border spinner-border-sm text-warning"></span>
        <button type="button" class="btn btn-primary">
        <span class="spinner-border  text-danger"></span>
        </button>
<br><br>
        <!-- spinner grow -->
        <span class="spinner-grow"></span>
        <span class="spinner-grow text-info"></span>
        <span class="spinner-grow text-info spinner-grow-sm"></span>
        <button type="button" class="btn btn-primary">
            <span class="spinner-grow text-danger spinner-grow-sm"></span>
        </button>

    </div>
</body>
</html>

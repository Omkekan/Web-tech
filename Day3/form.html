<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Document</title>
</head>

<body>
    <!-- form and validation classes in bootstrap 
    two classes:
    1.Needs validations 
    2.Validated 
    -->
    <div class="container mt-2">
        <form class="was-validated">
            <div class="form-group">
                <label for="uname" class="form-label">Enter your full name:</label>
                <input type="text" name="fname" id="uname" class="form-control" required>
                <span class="valid-feedback">Valid Data</span>
                <span class="invalid-feedback">Invalid Data</span>
            </div>
            <div class="form-group">
                <label for="upass" class="form-label">Enter your passwprd:</label>
                <input type="password" name="pass" id="upass" class="form-control" required>
                <span class="valid-feedback">Valid Data</span>
                <span class="invalid-feedback">Invalid Data</span>
            </div>
            <div class="form-group">
                <label for="uemail" class="form-label">Enter your email:</label>
                <input type="email" name="mail" id="uemail" class="form-control" required>
                <span class="valid-feedback">Valid Data</span>
                <span class="invalid-feedback">Invalid Data</span>
            </div>
            <div class="form-group">
                <label for="umobile" class="form-label">Enter your mobileno:</label>
                <input type="tel" name="mobileno" id="umobile" class="form-control" required>
                <span class="valid-feedback">Valid Data</span>
                <span class="invalid-feedback">Invalid Data</span>
            </div>
            <div class="form-group">
                <label for="" class="form-check-label">
                <input type="radio" name="gender" value="male" class="form-check-input" required>Male
                </label>
                <label for="" class="form-check-label">
                <input type="radio" name="gender" value="female" class="form-check-input" required>Female
                </label>
            </div>
            <div class="form-group">
                <label for="" class="form-label">Choose your course:</label>
                <select name="course" id="" class="form-control" required>
                    <option value="">Select</option>
                    <option value="html">Html</option>
                    <option value="css">Css</option>
                    <option value="js">Js</option>
                </select>
            </div>
            <br>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>

</html>

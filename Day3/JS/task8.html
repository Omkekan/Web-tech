<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Task8</title>
    <style>
        img {
            height: 500px;
            width: 40%;
            border: 2px solid black;
            padding: 3px;
            margin: 10px;
        }

        .name {
            color: maroon;
            font-size: 30px;
            font-weight: bold;
            margin: 10px;
        }
    </style>
</head>

<body>
    <img src="../Assets/biryani.jpeg" alt="biryani" id="bir1">
    <h3 class="name" id="name1">Biryani</h3>
    <br>
    <button type="button" class="btn btn-primary" onclick="change()">Change Image</button>

    <script>
        let isBiryani=true;
        function change() {
            if(isBiryani){
                document.getElementById("bir1").src = "../Assets/chickenmasala.jpeg";
                document.getElementById("name1").innerHTML = "Chicken Masala";
                isBiryani=false;
            }else{
                document.getElementById("bir1").src = "../Assets/biryani.jpeg";
                document.getElementById("name1").innerHTML = "Biryani";
                isBiryani=true;
            }
        }
    </script>



</body>

</html>

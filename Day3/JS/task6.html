<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Task6</title>
    <style>
        .passs {
            width: 100%;
            height: 50px;
        }

        .mail {
            width: 100%;
            height: 50px;
        }
        label{
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-xl-6 col-lg-12 col-md-12 col-sm-12">
                <label for="">Email</label><br>
                <input type="email" name="email" id="e1" class="mail">
            </div>
            <div class="col-xl-6 col-lg-12 col-md-12 col-sm-12">
                <label for="">Password</label><br>
                <input type="password" name="pass" id="p1" class="passs">
            </div>
        </div>
    </div>
    <div class="container mt-3">
        <label for="">Address</label>
        <input type="text" name="address" id="a1" class="mail" placeholder="1234 Main st">
    </div>
    <div class="container mt-3">
        <label for="">Address2</label>
        <input type="text" name="address" id="a1" class="mail" placeholder="Apartment,studio or floor">
    </div>
    <div class="container mt-3">
        <div class="row">
            <div class="col-xl-6 col-lg-12 col-md-12 col-sm-12">
            <label for="">City</label>
            <input type="text" name="city" id="c1" class="mail">
        </div>
        <div class="col-xl-4 col-lg-8 col-md-8 col-sm-8">
            <label for="">State</label>
            <select name="state" id="s1" class="mail">
                <option value="">Choose...</option>
                <option value="gujarat">Gujarat</option>
                <option value="maharashtra">Maharashtra</option>
                <option value="rajasthan">Rajasthan</option>
                <option value="punjab">Punjab</option>
            </select>
        </div>
        <div class="col-xl-2 col-lg-4 col-md-4 col-sm-4">
            <label for="">Zip</label>
            <input type="text" name="zip" id="z1" class="mail">
        </div>
        </div>
    </div>
    <div class="container mt-3">
        <input type="radio" name="check" id="r1">Check me out
        <br>
        <button type="submit" class="btn btn-primary mt-3">Sign in</button>
    </div>
</body>

</html>

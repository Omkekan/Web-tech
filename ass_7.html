<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>

    <div class="container mt-2">
        <img src="../Assests/momo.jpg" alt="momo" id="lab1"><br>
        <label id="foodName" >Momo</label><br><br>

        

        <button type="button" class="btn btn-primary" onclick="change_image('lab2')">Dosa</button>
        <button type="button" class="btn btn-primary" onclick="change_image('lab3')">Samosa</button>
        <button type="button" class="btn btn-primary" onclick="change_image('lab4')">Vada Paw</button>
    </div>
  
    <script>
        function change_image(id){
            if(id=="lab2"){
                document.getElementById("lab1").src="../Assests/dosa.jpg";
                document.getElementById("foodName").innerHTML = "Dosa";
            } else if(id=="lab3"){
                document.getElementById("lab1").src="../Assests/samosa.jpg";
                document.getElementById("foodName").innerHTML = "Samosa";
            }else{
                document.getElementById("lab1").src="../Assests/vadapav.jpg";
                document.getElementById("foodName").innerHTML = "vadapav";
            }
        }
    </script>

</body>
</html>
